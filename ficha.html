<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Escandinavo Fichas</title>
<link rel="icon" href="Logo_branca?v=22" type="image/png" sizes="any" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#12121c" />
<script>
(function () {
  var qs = location.search || '';
  // Same-origin only — never jsDelivr
  fetch('ficha-content.html?v=solid3')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
      setTimeout(function () {
        var b = document.getElementById('btn-voltar-agentes');
        if (b) b.onclick = function () { location.href = 'index.html'; };
      }, 400);
    })
    .catch(function (e) {
      document.body.innerHTML =
        '<div style="font-family:sans-serif;padding:40px;color:#eee;background:#0b0b10;min-height:100vh">' +
        '<p style="color:#f87171">Não foi possível carregar a ficha.</p>' +
        '<p style="color:#9797a8;font-size:.9rem">' + (e && e.message ? e.message : '') + '</p>' +
        '<p><a href="index.html" style="color:#a78bfa">← Voltar aos Agentes</a> · <a href="javascript:location.reload()" style="color:#a78bfa">Tentar de novo</a></p>' +
        '</div>';
    });
})();
</script>
</head>
<body style="background:#0b0b10;color:#888;font-family:sans-serif;padding:40px;margin:0">
Carregando ficha…
</body>
</html>
