<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Escandinavo Fichas</title>
<script>
fetch('https://cdn.jsdelivr.net/gh/matt1a1/Escandinavo-fichas@c8381d064de81055bfb207669552c837164b121a/index.html')
  .then(function (r) { return r.text(); })
  .then(function (html) {
    if (html.indexOf('btn-voltar-agentes') === -1) {
      html = html.replace(
        '<button id="btn-new" class="btn secondary">Nova Ficha</button>',
        '<button id="btn-voltar-agentes" class="btn secondary">\u2190 Agentes</button>\n        <button id="btn-new" class="btn secondary">Nova Ficha</button>'
      );
    }
    html = html.replace(/href="styles\.css[^"]*"/g, 'href="styles.css?v=fix7"');
    if (html.indexOf('styles-hab.css') === -1) html = html.replace('</head>', '  <link rel="stylesheet" href="styles-hab.css?v=habmine4" />\n</head>');
    else html = html.replace(/styles-hab\.css\?v=[^"]*/g, 'styles-hab.css?v=habmine4');
    if (html.indexOf('mobile.css') === -1) html = html.replace('</head>', '  <link rel="stylesheet" href="mobile.css?v=5" />\n</head>');
    else html = html.replace(/mobile\.css\?v=[^"]*/g, 'mobile.css?v=5');
    if (html.indexOf('compact.css') === -1) html = html.replace('</head>', '  <link rel="stylesheet" href="compact.css?v=fix7" />\n</head>');
    else html = html.replace(/compact\.css\?v=[^"]*/g, 'compact.css?v=fix7');
    html = html.replace(/rituais-catalog\.js[^"]*/g, 'rituais-catalog.js?v=livro1');
    html = html.replace(/rituais-extra\.js[^"]*/g, 'rituais-extra.js?v=livro1');
    html = html.replace(/itens-catalog\.js[^"]*/g, 'itens-catalog.js?v=livro1');
    html = html.replace(/habilidades-catalog\.js[^"]*/g, 'habilidades-catalog.js?v=livro1');
    html = html.replace(/data\.js[^"]*/g, 'data.js?v=hell1');
    html = html.replace(/origens-poderes\.js[^"]*/g, 'origens-poderes.js?v=hell1');
    html = html.replace(/app\.js[^"]*/g, 'app.js?v=tabsfix2');
    html = html.replace(/catalog-ui\.js[^"]*/g, 'catalog-ui.js?v=ritui2');
    html = html.replace(/<textarea/g, '<textarea spellcheck="true" lang="pt-BR"');
    var extras = '';
    if (html.indexOf('firebase-config.js') === -1) {
      extras += '<script src="firebase-config.js"><\/script>\n';
      extras += '<script src="auth.js?v=5"><\/script>\n';
    }
    if (html.indexOf('origens-poderes.js') === -1) extras += '<script src="origens-poderes.js?v=hell1"><\/script>\n';
    if (html.indexOf('habilidades-form.js') === -1) extras += '<script src="habilidades-form.js?v=hab1"><\/script>\n';
    if (html.indexOf('text-format.js') === -1) extras += '<script src="text-format.js?v=2"><\/script>\n';
    else html = html.replace(/text-format\.js[^"]*/g, 'text-format.js?v=2');
    if (html.indexOf('attrs-wheel.js') === -1) extras += '<script src="attrs-wheel.js?v=1"><\/script>\n';
    if (html.indexOf('arquivos-secretos-catalog.js') === -1) {
      extras += '<script src="arquivos-secretos-catalog.js?v=full3"><\/script>\n';
      extras += '<script src="arquivos-secretos-catalog-b.js?v=full3"><\/script>\n';
      extras += '<script src="arquivos-secretos-part2.js?v=full3"><\/script>\n';
      extras += '<script src="arquivos-secretos-trilhas.js?v=1"><\/script>\n';
      extras += '<script src="arquivos-secretos-rituais.js?v=2"><\/script>\n';
      extras += '<script src="arquivos-secretos-poderes-a.js?v=2"><\/script>\n';
      extras += '<script src="arquivos-secretos-poderes-b.js?v=2"><\/script>\n';
      extras += '<script src="arquivos-secretos-poderes-c.js?v=2"><\/script>\n';
      extras += '<script src="arquivos-secretos-poderes-d.js?v=2"><\/script>\n';
      extras += '<script src="arquivos-secretos-hellhunters.js?v=2"><\/script>\n';
      extras += '<script src="arquivos-secretos-ui.js?v=trilha1"><\/script>\n';
    }
    if (html.indexOf('habilidades-bridge.js') === -1) extras += '<script src="habilidades-bridge.js?v=10"><\/script>\n';
    if (html.indexOf('origem-classe-reset.js') === -1) extras += '<script src="origem-classe-reset.js?v=2"><\/script>\n';
    if (html.indexOf('combat-stats-fix.js') === -1) extras += '<script src="combat-stats-fix.js?v=4"><\/script>\n';
    if (html.indexOf('ficha-custom.js') === -1) extras += '<script src="ficha-custom.js?v=4"><\/script>\n';
    if (html.indexOf('ficha-custom-limits.js') === -1) extras += '<script src="ficha-custom-limits.js?v=3"><\/script>\n';
    html = html.replace(/<script[^>]*ficha-mascaras\.js[^>]*><\/script>/g, '');
    if (html.indexOf('app-hotfix.js') === -1) extras += '<script src="app-hotfix.js?v=1"><\/script>\n';
    if (html.indexOf('tabs-fix.js') === -1) extras += '<script src="tabs-fix.js?v=2"><\/script>\n';
    html = html.replace(/habilidades-ui\.js[^"]*/g, 'habilidades-ui.js?v=card2');
    html = html.replace(/habilidades-catalog\.js[^"]*/g, 'habilidades-catalog.js?v=livro1');
    if (extras) html = html.replace('</body>', extras + '</body>');
    document.open(); document.write(html); document.close();
    setTimeout(function () {
      var b = document.getElementById('btn-voltar-agentes');
      if (b) b.onclick = function () { location.href = 'index.html'; };
      function bindAllTabs() {
        document.querySelectorAll('.tab').forEach(function (tab) {
          if (tab.__tabBound) return;
          tab.__tabBound = true;
          tab.style.cursor = 'pointer';
          tab.style.pointerEvents = 'auto';
          tab.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var target = tab.getAttribute('data-tab');
            if (!target) return;
            document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
            tab.classList.add('active');
            var panel = document.getElementById('tab-' + target);
            if (panel) panel.classList.add('active');
          }, true);
        });
      }
      bindAllTabs();
      setTimeout(bindAllTabs, 500);
      setTimeout(bindAllTabs, 1500);

      function injectMascaraInline() {
        if (typeof state === 'undefined') return false;
        var isMask = state.tipoFicha === 'mascaras';
        if (!isMask) {
          try {
            var id = (typeof AGENTE_ID !== 'undefined' && AGENTE_ID) || new URLSearchParams(location.search).get('id') || '';
            var reg = JSON.parse(localStorage.getItem('escandinavo-agentes-registro') || '[]');
            for (var i = 0; i < reg.length; i++) {
              if (reg[i] && reg[i].id === id && reg[i].tipoFicha === 'mascaras') {
                state.tipoFicha = 'mascaras';
                isMask = true;
                break;
              }
            }
          } catch (e) {}
        }
        if (!isMask) return true;

        if (!document.getElementById('msk-css')) {
          var st = document.createElement('style');
          st.id = 'msk-css';
          st.textContent = [
            '#msk-box{margin:10px 0 12px;padding:14px 14px 12px;border-radius:12px;',
            'border:1px solid rgba(239,68,68,.45);background:linear-gradient(180deg,rgba(127,29,29,.28),rgba(20,10,12,.55));',
            'box-shadow:0 0 0 1px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25);}',
            '#msk-box .msk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}',
            '#msk-box .msk-title{margin:0;font-size:.92rem;font-weight:700;color:#fca5a5;letter-spacing:.02em;}',
            '#msk-box .msk-badge{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:999px;',
            'background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fecaca;}',
            '#msk-box .msk-badge.on{background:rgba(239,68,68,.35);color:#fff;border-color:#ef4444;}',
            '#msk-box .msk-help{margin:0 0 10px;font-size:.72rem;line-height:1.4;color:#e7b0b0;opacity:.9;}',
            '#msk-box .msk-actions{display:flex;flex-wrap:wrap;gap:8px;}',
            '#msk-box button{border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:.82rem;',
            'cursor:pointer;transition:filter .15s,transform .1s;}',
            '#msk-box button:hover{filter:brightness(1.08);}',
            '#msk-box button:active{transform:scale(.98);}',
            '#msk-on{background:linear-gradient(135deg,#9f1239,#e11d48);color:#fff;box-shadow:0 2px 10px rgba(225,29,72,.35);}',
            '#msk-stay{background:linear-gradient(135deg,#b91c1c,#dc2626);color:#fff;}',
            '#msk-off{background:#1c1917;color:#e7e5e4;border:1px solid #57534e !important;}',
            '#msk-msg{margin-top:8px;font-size:.75rem;color:#fecaca;min-height:1.1em;}',
            'body.msk-red{--accent:#ef4444;--accent-2:#b91c1c;}',
            'body.msk-red .brand h1{color:#fca5a5 !important;}',
            'body.msk-red .tab.active{border-bottom-color:#ef4444 !important;color:#fca5a5 !important;}'
          ].join('');
          document.head.appendChild(st);
        }

        var existing = document.getElementById('msk-box');
        if (existing) {
          var res2 = document.querySelector('section.card.resources') || document.querySelector('.resources');
          if (res2 && existing.nextElementSibling !== res2) {
            try { res2.parentNode.insertBefore(existing, res2); } catch (e) {}
          }
          var badge = existing.querySelector('.msk-badge');
          if (badge) {
            if (state.mascaraAtiva) { badge.textContent = 'ATIVA'; badge.classList.add('on'); document.body.classList.add('msk-red'); }
            else { badge.textContent = 'INATIVA'; badge.classList.remove('on'); document.body.classList.remove('msk-red'); }
          }
          return true;
        }

        var box = document.createElement('div');
        box.id = 'msk-box';
        box.innerHTML =
          '<div class="msk-head">' +
          '  <p class="msk-title">Forma Suprema</p>' +
          '  <span class="msk-badge" id="msk-badge">INATIVA</span>' +
          '</div>' +
          '<p class="msk-help">Ativar: a\u00e7\u00e3o de movimento + <b>6 SAN</b> \u00b7 Manter: <b>2 SAN</b>/rodada \u00b7 ' +
          'B\u00f4nus: <b>+20 PV</b>, <b>+10 PE</b>, <b>+10 Defesa</b> (+5 testes, +5 DT, +2 dados \u2014 mesa). ' +
          'Tirar: a\u00e7\u00e3o livre; se PV atuais < 20 ao perder o b\u00f4nus \u2192 0 PV (morrendo).</p>' +
          '<div class="msk-actions">' +
          '  <button type="button" id="msk-on">Colocar M\u00e1scara</button>' +
          '  <button type="button" id="msk-stay" style="display:none">Ficar com a m\u00e1scara (\u22126 SAN)</button>' +
          '  <button type="button" id="msk-off" style="display:none">Tirar m\u00e1scara</button>' +
          '</div>' +
          '<div id="msk-msg"></div>';

        var res = document.querySelector('section.card.resources') || document.querySelector('.resources');
        if (res && res.parentNode) res.parentNode.insertBefore(box, res);
        else {
          var at = document.querySelector('section.card.attributes') || document.querySelector('.attributes') || document.querySelector('.attr-wheel');
          if (at && at.parentNode) at.parentNode.insertBefore(box, at.nextSibling);
          else document.body.insertBefore(box, document.body.firstChild);
        }

        function msg(t) { var e = document.getElementById('msk-msg'); if (e) e.textContent = t || ''; }
        function isOn() { return !!state.mascaraAtiva; }
        function setBadge(active) {
          var b = document.getElementById('msk-badge');
          if (!b) return;
          if (active) { b.textContent = 'ATIVA'; b.classList.add('on'); document.body.classList.add('msk-red'); }
          else { b.textContent = 'INATIVA'; b.classList.remove('on'); document.body.classList.remove('msk-red'); }
        }
        function save() {
          if (typeof scheduleSave === 'function') scheduleSave();
          else if (typeof saveState === 'function') saveState();
          if (typeof renderRecursos === 'function') renderRecursos();
        }
        function showChoice(first) {
          document.getElementById('msk-on').style.display = 'none';
          var stay = document.getElementById('msk-stay');
          var off = document.getElementById('msk-off');
          stay.style.display = '';
          off.style.display = '';
          stay.textContent = first ? 'Ficar com a m\u00e1scara (\u22126 SAN)' : 'Manter m\u00e1scara (\u22122 SAN)';
        }
        function showIdle() {
          document.getElementById('msk-on').style.display = '';
          document.getElementById('msk-stay').style.display = 'none';
          document.getElementById('msk-off').style.display = 'none';
          document.getElementById('msk-stay').textContent = 'Ficar com a m\u00e1scara (\u22126 SAN)';
        }

        document.getElementById('msk-on').onclick = function () {
          showChoice(!isOn());
          msg(isOn() ? 'M\u00e1scara j\u00e1 ativa. Mantenha (\u22122 SAN) ou tire.' : 'Confirme para ativar (\u22126 SAN).');
        };

        document.getElementById('msk-stay').onclick = function () {
          var first = !isOn();
          var custo = first ? 6 : 2;
          var san = state.sanAtual != null ? Number(state.sanAtual) : 0;
          if (san < custo && !confirm('SAN insuficiente (' + san + '). Continuar? SAN pode ir a 0.')) return;
          state.sanAtual = Math.max(0, san - custo);

          if (first) {
            state.mascaraAtiva = true;
            var curPv = state.vidaAtual != null ? Number(state.vidaAtual) : 0;
            var curPe = state.peAtual != null ? Number(state.peAtual) : 0;
            state.vidaAtual = curPv + 20;
            state.peAtual = curPe + 10;
            setBadge(true);
            showChoice(false);
            msg('Forma Suprema ATIVA. \u22126 SAN \u00b7 +20 PV \u00b7 +10 PE \u00b7 +10 Defesa.');
          } else {
            msg('Forma mantida. \u22122 SAN (rodada).');
          }
          save();
        };

        document.getElementById('msk-off').onclick = function () {
          if (!isOn()) {
            showIdle();
            msg('Ativa\u00e7\u00e3o cancelada.');
            return;
          }
          if (!confirm('Tirar a m\u00e1scara? Voc\u00ea perde +20 PV / +10 PE / +10 Defesa.\nSe PV atuais < 20 ao perder o b\u00f4nus, ficam 0 (morrendo).')) return;
          var curPv = state.vidaAtual != null ? Number(state.vidaAtual) : 0;
          var curPe = state.peAtual != null ? Number(state.peAtual) : 0;
          state.mascaraAtiva = false;
          var npv = curPv - 20;
          if (npv < 0) npv = 0;
          state.vidaAtual = npv;
          state.peAtual = Math.max(0, curPe - 10);
          setBadge(false);
          showIdle();
          if (npv === 0) {
            alert('Ao tirar a m\u00e1scara voc\u00ea ficou com 0 PV e est\u00e1 morrendo.');
            msg('M\u00e1scara removida. 0 PV \u2014 morrendo.');
          } else {
            msg('M\u00e1scara removida. B\u00f4nus perdidos.');
          }
          save();
        };

        if (isOn()) {
          setBadge(true);
          showChoice(false);
          msg('Forma Suprema ATIVA \u00b7 +20 PV \u00b7 +10 PE \u00b7 +10 Defesa');
        } else {
          setBadge(false);
          showIdle();
          msg('');
        }

        if (typeof calcularDefesa === 'function' && !calcularDefesa.__mskInline) {
          var _d = calcularDefesa;
          window.calcularDefesa = function () {
            var v = _d.apply(this, arguments);
            return state.mascaraAtiva ? v + 10 : v;
          };
          calcularDefesa.__mskInline = true;
        }
        if (typeof calcularRecursos === 'function' && !calcularRecursos.__mskInline) {
          var _r = calcularRecursos;
          window.calcularRecursos = function () {
            var r = _r.apply(this, arguments);
            if (state.mascaraAtiva) {
              r.pvMax = (r.pvMax || 1) + 20;
              r.peMax = (r.peMax || 1) + 10;
            }
            return r;
          };
          calcularRecursos.__mskInline = true;
        }
        window.isFichaCustom = function () {
          return !!(state && (state.tipoFicha === 'custom' || state.tipoFicha === 'mascaras'));
        };
        return true;
      }

      setInterval(function () {
        try { injectMascaraInline(); } catch (e) {}
      }, 500);
    }, 600);
  })
  .catch(function () {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px;color:#c00">N\u00e3o foi poss\u00edvel carregar a ficha. Tente Ctrl+F5.</p>';
  });
</script>
</head>
<body>
<p style="font-family:sans-serif;padding:40px;color:#888">Carregando ficha\u2026</p>
</body>
</html>
