<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Escandinavo Fichas</title>
<link rel="icon" href="Logo_branca?v=22" type="image/png" sizes="any" />
<meta name="theme-color" content="#12121c" />
<script>
(function () {
  var done = false;
  var t = setTimeout(function () {
    if (done) return;
    document.body.innerHTML = '<div style="font-family:sans-serif;padding:40px;background:#0b0b10;color:#eee;min-height:100vh"><p style="color:#f87171">Demorou demais para carregar.</p><p><a href="index.html" style="color:#a78bfa">← Agentes</a> · <a href="javascript:location.reload()" style="color:#a78bfa">Tentar de novo</a></p></div>';
  }, 12000);

  function finish(html) {
    done = true;
    clearTimeout(t);
    document.open();
    document.write(html);
    document.close();
    setTimeout(function () {
      var b = document.getElementById('btn-voltar-agentes');
      if (b) b.onclick = function () { location.href = 'index.html'; };
    }, 400);
  }

  function fail(msg) {
    done = true;
    clearTimeout(t);
    document.body.innerHTML = '<div style="font-family:sans-serif;padding:40px;background:#0b0b10;color:#eee;min-height:100vh"><p style="color:#f87171">Erro ao carregar a ficha.</p><p style="color:#9797a8">' + msg + '</p><p><a href="index.html" style="color:#a78bfa">← Agentes</a></p></div>';
  }

  function patchAndFinish(html) {
    html = html.replace(/app\.js[^"]*/g, 'https://cdn.jsdelivr.net/gh/matt1a1/Escandinavo-fichas@843b6316775cfe32a5b0826ee97d310dd7d0aff9/app.js');
    html = html.replace(/data\.js[^"]*/g, 'data.js?v=hell4');
    html = html.replace(/habilidades-catalog\.js[^"]*/g, 'habilidades-catalog.js?v=livro6');
    html = html.replace(/rituais-catalog\.js[^"]*/g, 'rituais-catalog.js?v=livro1');
    html = html.replace(/itens-catalog\.js[^"]*/g, 'itens-catalog.js?v=livro1');
    html = html.replace(/catalog-ui\.js[^"]*/g, 'catalog-ui.js?v=ritui3');
    html = html.replace(/habilidades-ui\.js[^"]*/g, 'habilidades-ui.js?v=card3');
    if (html.indexOf('btn-voltar-agentes') === -1) {
      html = html.replace(
        '<button id="btn-new" class="btn secondary">Nova Ficha</button>',
        '<button id="btn-voltar-agentes" class="btn secondary">\u2190 Agentes</button><button id="btn-new" class="btn secondary">Nova Ficha</button>'
      );
    }
    var extras = '';
    var scripts = [
      'firebase-config.js',
      'auth.js?v=restore1',
      'combat-stats-fix.js?v=7',
      'ficha-custom.js?v=6',
      'ficha-custom-limits.js?v=6',
      'controls-fix.js?v=6',
      'app-res-fix.js?v=3',
      'mascara-fix.js?v=14',
      'ui-dialog.js?v=3',
      'logo-mark-patch.js?v=22',
      'origens-poderes.js?v=oficial1',
      'habilidades-catalog-extra.js?v=7'
    ];
    for (var i = 0; i < scripts.length; i++) {
      extras += '<script src="' + scripts[i] + '"><\/script>\n';
    }
    html = html.replace('</body>', extras + '</body>');
    finish(html);
  }

  fetch('ficha-content.html?v=solid3')
    .then(function (r) { if (!r.ok) throw new Error('local ' + r.status); return r.text(); })
    .then(finish)
    .catch(function () {
      return fetch('https://cdn.jsdelivr.net/gh/matt1a1/Escandinavo-fichas@c8381d064de81055bfb207669552c837164b121a/index.html')
        .then(function (r) { if (!r.ok) throw new Error('cdn ' + r.status); return r.text(); })
        .then(patchAndFinish)
        .catch(function (e) { fail(String(e && e.message || e)); });
    });
})();
</script>
</head>
<body style="background:#0b0b10;color:#888;font-family:sans-serif;padding:40px;margin:0">
Carregando ficha…
</body>
</html>
