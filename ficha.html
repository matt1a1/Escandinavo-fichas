<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Escandinavo Fichas</title>
<script>
fetch('https://cdn.jsdelivr.net/gh/matt1a1/Escandinavo-fichas@c8381d064de81055bfb207669552c837164b121a/index.html')
  .then(function(r) { return r.text(); })
  .then(function(html) {
    if (html.indexOf('btn-voltar-agentes') === -1) {
      html = html.replace(
        '<button id="btn-new" class="btn secondary">Nova Ficha</button>',
        '<button id="btn-voltar-agentes" class="btn secondary">\u2190 Agentes</button>\n        <button id="btn-new" class="btn secondary">Nova Ficha</button>'
      );
    }
    html = html.replace(/styles\.css(\?v=[^"']*)?/g, 'styles.css?v=hab3');
    if (html.indexOf('styles-hab.css') === -1) {
      html = html.replace(
        /href="styles\.css[^"']*"/,
        'href="styles.css?v=hab3" />\n  <link rel="stylesheet" href="styles-hab.css?v=hab3"'
      );
    }
    // Poderes de origem + patch de descrições
    if (html.indexOf('origens-poderes.js') === -1) {
      html = html.replace(
        /habilidades-catalog\.js[^"']*"></script>/,
        function(m) { return m + '\n  <script src="origens-poderes.js?v=1"><\/script>'; }
      );
    }
    if (html.indexOf('habilidades-fix.js') === -1) {
      html = html.replace(
        '</body>',
        '<script src="habilidades-fix.js?v=hab1"><\/script>\n</body>'
      );
    }
    document.open();
    document.write(html);
    document.close();
    setTimeout(function() {
      var b = document.getElementById('btn-voltar-agentes');
      if (b) b.onclick = function() { location.href = 'index.html'; };
    }, 800);
  })
  .catch(function() {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px;color:#c00">N\u00e3o foi poss\u00edvel carregar a ficha. Tente Ctrl+F5.</p>';
  });
</script>
</head>
<body>
<p style="font-family:sans-serif;padding:40px;color:#888">Carregando ficha\u2026</p>
</body>
</html>
