<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Escandinavo Fichas</title>
<link rel="icon" href="Logo_branca?v=22" type="image/png" sizes="any" />
<meta name="theme-color" content="#12121c" />
<script>
(function () {
  var done = false;
  var t = setTimeout(function () {
    if (done) return;
    document.body.innerHTML = '<div style="font-family:sans-serif;padding:40px;background:#0b0b10;color:#eee;min-height:100vh"><p style="color:#f87171">Demorou demais para carregar a ficha.</p><p><a href="index.html" style="color:#a78bfa">← Agentes</a> · <a href="javascript:location.reload()" style="color:#a78bfa">Tentar de novo</a></p></div>';
  }, 10000);

  function finish(html) {
    done = true;
    clearTimeout(t);
    document.open();
    document.write(html);
    document.close();
  }

  // Same-origin only — no CDN hang
  fetch('ficha-content.html?v=solid1')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(finish)
    .catch(function (e) {
      done = true;
      clearTimeout(t);
      document.body.innerHTML =
        '<div style="font-family:sans-serif;padding:40px;background:#0b0b10;color:#eee;min-height:100vh">' +
        '<p style="color:#f87171">Não foi possível carregar a ficha.</p>' +
        '<p style="color:#9797a8">' + (e && e.message ? e.message : '') + '</p>' +
        '<p><a href="index.html" style="color:#a78bfa">← Agentes</a></p></div>';
    });
})();
</script>
</head>
<body style="background:#0b0b10;color:#888;font-family:sans-serif;padding:40px;margin:0">
Carregando ficha…
</body>
</html>
