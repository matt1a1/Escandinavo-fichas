<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Escandinavo Fichas</title>
<script>
fetch('https://cdn.jsdelivr.net/gh/matt1a1/Escandinavo-fichas@c8381d064de81055bfb207669552c837164b121a/index.html')
  .then(function (r) { return r.text(); })
  .then(function (html) {
    if (html.indexOf('btn-voltar-agentes') === -1) {
      html = html.replace(
        '<button id="btn-new" class="btn secondary">Nova Ficha</button>',
        '<button id="btn-voltar-agentes" class="btn secondary">← Agentes</button>\n        <button id="btn-new" class="btn secondary">Nova Ficha</button>'
      );
    }

    html = html.replace(/href="styles\.css[^"]*"/g, 'href="styles.css?v=mob2"');
    if (html.indexOf('styles-hab.css') === -1) {
      html = html.replace('</head>', '  <link rel="stylesheet" href="styles-hab.css?v=mob2" />\n</head>');
    }
    if (html.indexOf('mobile.css') === -1) {
      html = html.replace('</head>', '  <link rel="stylesheet" href="mobile.css?v=2" />\n</head>');
    } else {
      html = html.replace(/mobile\.css\?v=[^"]*/g, 'mobile.css?v=2');
    }

    var extras = '';
    if (html.indexOf('origens-poderes.js') === -1) {
      extras += '<script src="origens-poderes.js?v=1"><\/script>\n';
    }
    if (html.indexOf('habilidades-fix.js') === -1) {
      extras += '<script src="habilidades-fix.js?v=hab1"><\/script>\n';
    }
    if (extras) html = html.replace('</body>', extras + '</body>');

    document.open();
    document.write(html);
    document.close();

    setTimeout(function () {
      var b = document.getElementById('btn-voltar-agentes');
      if (b) b.onclick = function () { location.href = 'index.html'; };
    }, 800);
  })
  .catch(function () {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px;color:#c00">Não foi possível carregar a ficha. Tente Ctrl+F5.</p>';
  });
</script>
</head>
<body>
<p style="font-family:sans-serif;padding:40px;color:#888">Carregando ficha…</p>
</body>
</html>
