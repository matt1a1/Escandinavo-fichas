<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Escandinavo Fichas</title>
<link rel="icon" href="Logo_branca?v=22" type="image/png" sizes="any" />
<meta name="theme-color" content="#12121c" />
<script>
(function () {
  var done = false;
  var t = setTimeout(function () {
    if (done) return;
    document.body.innerHTML = '<div style="font-family:sans-serif;padding:40px;background:#0b0b10;color:#eee;min-height:100vh"><p style="color:#f87171">Demorou demais.</p><p><a href="index.html" style="color:#a78bfa">← Agentes</a></p></div>';
  }, 12000);

  var n = 3;
  var loaded = 0;
  window.__FICHA_PARTS = [];

  function tryFinish() {
    if (loaded < n) return;
    var html = '';
    for (var i = 0; i < n; i++) {
      if (!window.__FICHA_PARTS[i]) {
        done = true; clearTimeout(t);
        document.body.innerHTML = '<div style="padding:40px;background:#0b0b10;color:#f87171;font-family:sans-serif">Falha ao montar a ficha (parte ' + i + ').</div>';
        return;
      }
      html += window.__FICHA_PARTS[i];
    }
    done = true;
    clearTimeout(t);
    document.open();
    document.write(html);
    document.close();
  }

  for (var i = 0; i < n; i++) {
    (function (idx) {
      var s = document.createElement('script');
      s.src = 'ficha-html-part-' + idx + '.js?v=solid1';
      s.onload = function () { loaded++; tryFinish(); };
      s.onerror = function () {
        done = true; clearTimeout(t);
        document.body.innerHTML = '<div style="padding:40px;background:#0b0b10;color:#f87171;font-family:sans-serif">Erro ao carregar parte ' + idx + ' da ficha. <a href="index.html" style="color:#a78bfa">← Agentes</a></div>';
      };
      document.head.appendChild(s);
    })(i);
  }
})();
</script>
</head>
<body style="background:#0b0b10;color:#888;font-family:sans-serif;padding:40px;margin:0">
Carregando ficha…
</body>
</html>
