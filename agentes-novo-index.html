<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Escandinavo Fichas — Agentes</title>
<link rel="stylesheet" href="styles.css" onerror="this.remove()" />
<style>
  :root{
    --ag-bg: var(--bg, #0b0b10);
    --ag-panel: var(--panel, #16161f);
    --ag-panel-2: var(--panel-2, #1d1d29);
    --ag-border: var(--border, #2a2a38);
    --ag-accent: var(--accent, #8b5cf6);
    --ag-accent-2: #a855f7;
    --ag-text: var(--text, #f2f2f6);
    --ag-text-dim: var(--text-dim, #9797a8);
    --ag-danger: var(--danger, #ef4444);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--ag-bg);
    color:var(--ag-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    margin:0;
    min-height:100vh;
  }
  .ag-nav{
    display:flex;align-items:center;gap:28px;
    padding:18px 32px;border-bottom:1px solid var(--ag-border);
    background:linear-gradient(180deg, rgba(139,92,246,.08), transparent);
  }
  .ag-nav .brand{font-weight:700;letter-spacing:.02em;margin-right:auto;color:var(--ag-text);}
  .ag-nav a{color:var(--ag-text-dim);text-decoration:none;font-size:.95rem;padding-bottom:4px;border-bottom:2px solid transparent;cursor:pointer;}
  .ag-nav a.active{color:var(--ag-text);border-bottom-color:var(--ag-accent);}
  .ag-wrap{max-width:1100px;margin:0 auto;padding:32px;}
  .ag-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
  .ag-header h1{font-size:1.1rem;font-weight:600;margin:0;color:var(--ag-text-dim);}
  .ag-header h1 b{color:var(--ag-text);}
  .btn-primary{
    background:var(--ag-accent);color:#fff;border:none;border-radius:8px;
    padding:10px 18px;font-weight:600;font-size:.9rem;cursor:pointer;
  }
  .btn-primary:hover{background:var(--ag-accent-2);}
  .btn-ghost{
    background:transparent;color:var(--ag-text-dim);border:1px solid var(--ag-border);
    border-radius:8px;padding:9px 16px;font-size:.9rem;cursor:pointer;
  }
  .btn-ghost:hover{color:var(--ag-text);border-color:var(--ag-text-dim);}
  .ag-search{
    width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--ag-border);
    background:var(--ag-panel);color:var(--ag-text);margin-bottom:22px;font-size:.9rem;
  }
  .ag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .ag-card{
    background:var(--ag-panel);border:1px solid var(--ag-border);border-radius:12px;
    padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;
  }
  .ag-card .avatar{
    width:100%;height:90px;border-radius:8px;background:var(--ag-panel-2);
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--ag-text-dim);
  }
  .ag-card h3{margin:0;font-size:1rem;}
  .ag-card .meta{font-size:.78rem;color:var(--ag-text-dim);}
  .ag-card .del{
    position:absolute;top:10px;right:10px;background:transparent;border:none;color:var(--ag-text-dim);
    cursor:pointer;font-size:.85rem;padding:4px;border-radius:6px;
  }
  .ag-card .del:hover{color:var(--ag-danger);background:rgba(239,68,68,.1);}
  .ag-card .acessar{
    margin-top:auto;background:var(--ag-accent);color:#fff;text-align:center;text-decoration:none;
    padding:9px;border-radius:8px;font-size:.85rem;font-weight:600;
  }
  .ag-card .acessar:hover{background:var(--ag-accent-2);}
  .ag-empty{
    grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ag-text-dim);
    border:1px dashed var(--ag-border);border-radius:12px;
  }
  .camp-card{
    background:var(--ag-panel);border:1px solid var(--ag-border);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .camp-cover{
    height:110px;background:linear-gradient(135deg,var(--ag-accent),#4c1d95);
    display:flex;align-items:flex-start;justify-content:space-between;padding:10px;
    font-size:.78rem;color:rgba(255,255,255,.85);
  }
  .camp-body{padding:14px;display:flex;flex-direction:column;gap:8px;}
  .camp-body h3{margin:0;font-size:1rem;}
  .camp-body .meta{font-size:.78rem;color:var(--ag-text-dim);}
  .camp-body button{
    margin-top:auto;background:var(--ag-accent);color:#fff;border:none;border-radius:8px;
    padding:9px;font-size:.85rem;font-weight:600;cursor:pointer;
  }

  /* ===== Wizard ===== */
  .wizard-overlay{
    position:fixed;inset:0;background:var(--ag-bg);z-index:200;overflow-y:auto;
  }
  .wizard-overlay[hidden]{display:none;}
  .wizard-top{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid var(--ag-border);}
  .wizard-steps{display:flex;gap:14px;justify-content:center;align-items:center;padding:26px 10px 6px;font-size:.85rem;flex-wrap:wrap;}
  .wizard-steps span.step{color:var(--ag-text-dim);position:relative;padding:0 6px;}
  .wizard-steps span.step.active{color:var(--ag-accent);font-weight:700;}
  .wizard-steps span.sep{color:var(--ag-border);}
  .wizard-body{max-width:820px;margin:0 auto;padding:24px 28px 60px;}
  .wizard-body h2{font-size:1.15rem;margin:0 0 14px;}
  .wizard-body p{color:var(--ag-text-dim);line-height:1.6;font-size:.92rem;}
  .wizard-body p b{color:var(--ag-text);}
  .wizard-nav{display:flex;justify-content:space-between;margin-top:28px;}
  .attr-ring{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:320px;margin:24px auto 0;
  }
  .attr-ring .a{
    background:var(--ag-panel);border:1px solid var(--ag-border);border-radius:10px;
    padding:12px 8px;text-align:center;
  }
  .attr-ring .a b{display:block;font-size:1.3rem;}
  .attr-ring .a small{color:var(--ag-text-dim);font-size:.7rem;letter-spacing:.05em;}
  .origem-search{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--ag-border);background:var(--ag-panel);color:var(--ag-text);margin-bottom:14px;}
  .origem-item{border:1px solid var(--ag-border);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--ag-panel);}
  .origem-item summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;font-weight:600;}
  .origem-item summary::-webkit-details-marker{display:none;}
  .origem-item .det{padding:0 16px 14px;color:var(--ag-text-dim);font-size:.85rem;}
  .origem-item.selected{border-color:var(--ag-accent);}
  .btn-escolher{background:var(--ag-accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:.8rem;cursor:pointer;flex-shrink:0;}
  .classe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;}
  .classe-card{background:var(--ag-panel);border:1px solid var(--ag-border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .classe-card.selected{border-color:var(--ag-accent);}
  .classe-card h3{margin:0;}
  .classe-card p{font-size:.82rem;flex:1;}
  .mundano-row{text-align:center;margin-top:16px;}
  .finais-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  .finais-grid label{display:block;font-size:.8rem;color:var(--ag-text-dim);margin-bottom:6px;}
  .finais-grid input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--ag-border);background:var(--ag-panel);color:var(--ag-text);}
  .resumo-box{margin-top:20px;padding:14px 16px;border:1px solid var(--ag-border);border-radius:10px;background:var(--ag-panel);font-size:.85rem;color:var(--ag-text-dim);}
  .resumo-box b{color:var(--ag-text);}
  @media (max-width:720px){ .classe-grid{grid-template-columns:1fr;} .finais-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<nav class="ag-nav">
  <span class="brand">◈ Escandinavo Fichas</span>
  <a data-view="agentes" class="active">Agentes</a>
  <a data-view="campanhas">Campanhas</a>
</nav>

<div class="ag-wrap">

  <!-- ===== VIEW: AGENTES ===== -->
  <section id="view-agentes">
    <div class="ag-header">
      <h1>Agentes: <b id="ag-count">0</b></h1>
      <button class="btn-primary" id="btn-novo-agente">+ Novo Agente</button>
    </div>
    <input type="text" class="ag-search" id="ag-search" placeholder="Buscar agente..." />
    <div class="ag-grid" id="ag-grid"></div>
  </section>

  <!-- ===== VIEW: CAMPANHAS ===== -->
  <section id="view-campanhas" hidden>
    <div class="ag-header">
      <h1>Campanhas: <b id="camp-count">0</b></h1>
      <button class="btn-primary" id="btn-nova-campanha">+ Nova Campanha</button>
    </div>
    <div class="ag-grid" id="camp-grid"></div>
  </section>

</div>

<!-- ===== WIZARD: NOVO AGENTE ===== -->
<div class="wizard-overlay" id="wizard" hidden>
  <div class="wizard-top">
    <span class="brand">◈ Novo Agente</span>
    <button class="btn-ghost" id="wizard-close">Cancelar</button>
  </div>
  <div class="wizard-steps" id="wizard-steps"></div>
  <div class="wizard-body" id="wizard-body"></div>
</div>

<script src="data.js" onerror="console.warn('data.js não encontrado ao lado de agentes.html')"></script>
<script>
const REGISTRO_KEY = 'escandinavo-agentes-registro';
const CAMPANHAS_KEY = 'escandinavo-campanhas-registro';

function lerAgentes(){ try{ return JSON.parse(localStorage.getItem(REGISTRO_KEY)) || []; }catch(e){ return []; } }
function salvarAgentes(lista){ localStorage.setItem(REGISTRO_KEY, JSON.stringify(lista)); }
function lerCampanhas(){ try{ return JSON.parse(localStorage.getItem(CAMPANHAS_KEY)) || []; }catch(e){ return []; } }
function salvarCampanhas(lista){ localStorage.setItem(CAMPANHAS_KEY, JSON.stringify(lista)); }

const CLASSE_LABEL = { combatente:'Combatente', especialista:'Especialista', ocultista:'Ocultista', mundano:'Mundano' };

function formatarData(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR');
}

function renderAgentes(){
  const grid = document.getElementById('ag-grid');
  const termo = (document.getElementById('ag-search').value || '').toLowerCase();
  let lista = lerAgentes().sort((a,b)=> b.atualizadoEm - a.atualizadoEm);
  if (termo) lista = lista.filter(a => (a.nome||'').toLowerCase().includes(termo));
  document.getElementById('ag-count').textContent = lerAgentes().length;
  grid.innerHTML = '';
  if (!lista.length){
    grid.innerHTML = '<div class="ag-empty">Nenhum agente ainda. Clique em "Novo Agente" para criar sua primeira ficha.</div>';
    return;
  }
  lista.forEach(a => {
    const card = document.createElement('div');
    card.className = 'ag-card';
    card.innerHTML = `
      <button class="del" title="Excluir" data-id="${a.id}">✕</button>
      <div class="avatar">◈</div>
      <h3>${a.nome || 'Sem nome'}</h3>
      <div class="meta">${CLASSE_LABEL[a.classe] || a.classe || '—'} · NEX ${a.nex ?? 5}% · atualizado em ${formatarData(a.atualizadoEm)}</div>
      <a class="acessar" href="ficha.html?id=${encodeURIComponent(a.id)}">Acessar Ficha</a>
    `;
    grid.appendChild(card);
  });
  grid.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', () => {
    if (!confirm('Excluir este agente? Essa ação não pode ser desfeita.')) return;
    const id = btn.dataset.id;
    salvarAgentes(lerAgentes().filter(a => a.id !== id));
    localStorage.removeItem('escandinavo-ficha-' + id);
    renderAgentes();
  }));
}
document.getElementById('ag-search').addEventListener('input', renderAgentes);

function renderCampanhas(){
  const grid = document.getElementById('camp-grid');
  const lista = lerCampanhas().sort((a,b)=> b.criadaEm - a.criadaEm);
  document.getElementById('camp-count').textContent = lista.length;
  grid.innerHTML = '';
  if (!lista.length){
    grid.innerHTML = '<div class="ag-empty">Nenhuma campanha ainda. Crie uma para organizar suas mesas.</div>';
    return;
  }
  lista.forEach(c => {
    const card = document.createElement('div');
    card.className = 'camp-card';
    card.innerHTML = `
      <div class="camp-cover"><span>👥 ${c.jogadores || 0}</span></div>
      <div class="camp-body">
        <h3>${c.nome}</h3>
        <div class="meta">Iniciada em: ${formatarData(c.criadaEm)}</div>
        <button data-id="${c.id}">Acessar</button>
      </div>`;
    grid.appendChild(card);
  });
  grid.querySelectorAll('button[data-id]').forEach(btn => btn.addEventListener('click', () => {
    alert('Campanhas ainda estão em construção — em breve você poderá organizar agentes, ameaças e sessões aqui.');
  }));
}

document.getElementById('btn-nova-campanha').addEventListener('click', () => {
  const nome = prompt('Nome da campanha:');
  if (!nome || !nome.trim()) return;
  const jogadores = parseInt(prompt('Quantos jogadores (aproximado)?', '3') || '0', 10) || 0;
  const lista = lerCampanhas();
  lista.push({ id: 'camp_' + Date.now().toString(36), nome: nome.trim(), jogadores, criadaEm: Date.now() });
  salvarCampanhas(lista);
  renderCampanhas();
});

document.querySelectorAll('.ag-nav a').forEach(link => link.addEventListener('click', () => {
  document.querySelectorAll('.ag-nav a').forEach(a => a.classList.remove('active'));
  link.classList.add('active');
  const view = link.dataset.view;
  document.getElementById('view-agentes').hidden = view !== 'agentes';
  document.getElementById('view-campanhas').hidden = view !== 'campanhas';
  if (view === 'campanhas') renderCampanhas();
}));

/* ===================== WIZARD ===================== */
const STEPS = ['Atributos', 'Origem', 'Classe', 'Toques Finais'];
let stepAtual = 0;
let novoAgente = { nome:'', jogador:'', origem:'', classe:'' };

function abrirWizard(){
  stepAtual = 0;
  novoAgente = { nome:'', jogador:'', origem:'', classe:'' };
  document.getElementById('wizard').hidden = false;
  renderWizard();
}
function fecharWizard(){ document.getElementById('wizard').hidden = true; }
document.getElementById('btn-novo-agente').addEventListener('click', abrirWizard);
document.getElementById('wizard-close').addEventListener('click', () => {
  if (confirm('Cancelar a criação deste agente?')) fecharWizard();
});

function renderStepsBar(){
  const bar = document.getElementById('wizard-steps');
  bar.innerHTML = STEPS.map((s,i) =>
    `<span class="step${i===stepAtual?' active':''}">${s}</span>` + (i<STEPS.length-1 ? '<span class="sep">──────</span>' : '')
  ).join('');
}

function origensDisponiveis(){
  return (typeof ORIGENS !== 'undefined') ? ORIGENS : {};
}
function classesDisponiveis(){
  return (typeof CLASSES !== 'undefined') ? CLASSES : {};
}

const CLASSE_DESCRICAO = {
  combatente: 'Vive na linha de frente. Especialista em combate corpo a corpo e à distância, é quem encara o perigo de frente e protege o grupo quando a situação vira pancadaria.',
  especialista: 'Aposta em versatilidade: perícias amplas, raciocínio rápido e um pouco de tudo. É quem resolve problemas fora do combate — e ainda se vira bem numa briga.',
  ocultista: 'Estudou o Outro Lado o suficiente para manipulá-lo. Conjura rituais paranormais, mas paga um preço: menos vida e mais exposição ao que existe além do véu.',
};

function renderWizard(){
  renderStepsBar();
  const body = document.getElementById('wizard-body');
  if (stepAtual === 0) body.innerHTML = passoAtributos();
  else if (stepAtual === 1) body.innerHTML = passoOrigem();
  else if (stepAtual === 2) body.innerHTML = passoClasse();
  else body.innerHTML = passoFinais();
  ligarEventosPasso();
  window.scrollTo(0,0);
}

function passoAtributos(){
  return `
    <h2>Atributos</h2>
    <p>Todo agente começa com os cinco atributos em <b>1</b>. Você recebe <b>4 pontos</b> para distribuir entre eles como quiser — e ainda pode reduzir um atributo para <b>0</b> em troca de <b>+1 ponto</b> extra para gastar em outro lugar.</p>
    <p>No início, nenhum atributo pode passar de <b>3</b>. Esse limite só sobe mais tarde, conforme o seu NEX evolui.</p>
    <div class="attr-ring">
      <div class="a"><b>1</b><small>FORÇA</small></div>
      <div class="a"><b>1</b><small>AGILIDADE</small></div>
      <div class="a"><b>1</b><small>INTELECTO</small></div>
      <div class="a"><b>1</b><small>PRESENÇA</small></div>
      <div class="a"><b>1</b><small>VIGOR</small></div>
    </div>
    <p style="text-align:center;margin-top:18px;">Você vai distribuir os pontos de verdade na ficha, depois de criar o agente. Aqui é só para entender a regra.</p>
    ${navBotoes(false)}
  `;
}

function passoOrigem(){
  const origens = origensDisponiveis();
  const itens = Object.entries(origens).map(([id,o]) => `
    <details class="origem-item${novoAgente.origem===id?' selected':''}" data-id="${id}">
      <summary>
        <span>${o.nome}</span>
        <button type="button" class="btn-escolher" data-id="${id}">${novoAgente.origem===id?'Selecionada':'Escolher'}</button>
      </summary>
      <div class="det">Perícias treinadas: ${(o.pericias||[]).length ? o.pericias.join(', ') : '—'}<br/>Poder de origem: ${o.poder || '—'}</div>
    </details>
  `).join('');
  return `
    <h2>Origem</h2>
    <p>A origem representa o que seu agente fazia antes de entrar na Ordem. Ela concede <b>duas perícias treinadas</b> e um <b>poder de origem</b>. Escolha a que mais combina com o seu personagem — ou qualquer uma, para começar a jogar rápido.</p>
    <input type="text" class="origem-search" id="origem-search" placeholder="Buscar origem..." />
    <div id="origem-lista">${itens || '<p>Nenhuma origem encontrada (verifique se data.js está na mesma pasta).</p>'}</div>
    ${navBotoes(true)}
  `;
}

function passoClasse(){
  const nomes = { combatente:'Combatente', especialista:'Especialista', ocultista:'Ocultista' };
  const cards = Object.keys(nomes).map(id => `
    <div class="classe-card${novoAgente.classe===id?' selected':''}">
      <h3>${nomes[id]}</h3>
      <p>${CLASSE_DESCRICAO[id]}</p>
      <button type="button" class="btn-escolher" data-classe="${id}">${novoAgente.classe===id?'Selecionada':'Escolher'}</button>
    </div>
  `).join('');
  return `
    <h2>Classe</h2>
    <p>A classe define o treinamento que seu agente recebeu para enfrentar o paranormal — é a decisão mais importante da ficha, porque define seu papel no grupo.</p>
    <div class="classe-grid">${cards}</div>
    <div class="mundano-row">
      <button type="button" class="btn-ghost" id="btn-mundano">Começar sem classe (Mundano)</button>
    </div>
    ${navBotoes(true)}
  `;
}

function passoFinais(){
  return `
    <h2>Toques Finais</h2>
    <p>Só falta dar um nome ao seu agente. Você poderá preencher aparência, personalidade, histórico e o resto da ficha depois — sem pressa.</p>
    <div class="finais-grid">
      <div>
        <label>Nome do agente</label>
        <input type="text" id="input-nome" value="${novoAgente.nome}" placeholder="Ex: Helena Duarte" />
      </div>
      <div>
        <label>Nome do jogador</label>
        <input type="text" id="input-jogador" value="${novoAgente.jogador}" placeholder="Seu nome" />
      </div>
    </div>
    <div class="resumo-box">
      <b>Resumo:</b> ${novoAgente.nome || 'Sem nome'} · Origem: ${origensDisponiveis()[novoAgente.origem]?.nome || 'não escolhida'} · Classe: ${CLASSE_LABEL[novoAgente.classe] || 'Mundano'}
    </div>
    ${navBotoes(true, true)}
  `;
}

function navBotoes(mostrarVoltar, finalizar){
  return `
    <div class="wizard-nav">
      <div>${mostrarVoltar ? '<button type="button" class="btn-ghost" id="btn-voltar">Voltar</button>' : ''}</div>
      <button type="button" class="btn-primary" id="btn-avancar">${finalizar ? 'Criar Ficha' : 'Continuar'}</button>
    </div>
  `;
}

function ligarEventosPasso(){
  const voltar = document.getElementById('btn-voltar');
  if (voltar) voltar.addEventListener('click', () => { stepAtual--; renderWizard(); });

  const avancar = document.getElementById('btn-avancar');
  if (avancar) avancar.addEventListener('click', () => {
    if (stepAtual === 2 && !novoAgente.classe) {
      if (!confirm('Nenhuma classe selecionada — continuar como Mundano?')) return;
    }
    if (stepAtual === 3) { criarAgente(); return; }
    stepAtual++;
    renderWizard();
  });

  // passo Origem
  document.querySelectorAll('#origem-lista .btn-escolher').forEach(btn => btn.addEventListener('click', (e) => {
    e.preventDefault();
    novoAgente.origem = btn.dataset.id;
    renderWizard();
  }));
  const buscaOrigem = document.getElementById('origem-search');
  if (buscaOrigem) buscaOrigem.addEventListener('input', () => {
    const termo = buscaOrigem.value.toLowerCase();
    document.querySelectorAll('#origem-lista .origem-item').forEach(el => {
      const nome = el.querySelector('summary span').textContent.toLowerCase();
      el.style.display = nome.includes(termo) ? '' : 'none';
    });
  });

  // passo Classe
  document.querySelectorAll('.classe-card .btn-escolher').forEach(btn => btn.addEventListener('click', () => {
    novoAgente.classe = btn.dataset.classe;
    renderWizard();
  }));
  const btnMundano = document.getElementById('btn-mundano');
  if (btnMundano) btnMundano.addEventListener('click', () => {
    novoAgente.classe = 'mundano';
    stepAtual++;
    renderWizard();
  });

  // passo Toques Finais
  const inputNome = document.getElementById('input-nome');
  if (inputNome) inputNome.addEventListener('input', () => { novoAgente.nome = inputNome.value; });
  const inputJogador = document.getElementById('input-jogador');
  if (inputJogador) inputJogador.addEventListener('input', () => { novoAgente.jogador = inputJogador.value; });
}

function criarAgente(){
  const id = 'ag_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const classeValida = (novoAgente.classe && novoAgente.classe !== 'mundano') ? novoAgente.classe : 'ocultista';
  const origemValida = novoAgente.origem || 'investigador';
  const ficha = {
    nome: novoAgente.nome || '', jogador: novoAgente.jogador || '',
    origem: origemValida, classe: classeValida, nex: 5, patente: 'Recruta',
    atributos: { for: 1, agi: 1, int: 1, pre: 1, vig: 1 }, pericias: {},
    vidaAtual: null, sanAtual: null, peAtual: null,
    aparencia: '', personalidade: '', historico: '', objetivo: '', anotacoes: '',
    habilidades: [], rituais: [], itens: [], ataques: [], pp: 0, credito: 'Baixo',
    itensLimite: { I: 2, II: 0, III: 0, IV: 0 },
    _mundano: novoAgente.classe === 'mundano' || false,
  };
  localStorage.setItem('escandinavo-ficha-' + id, JSON.stringify(ficha));
  const registro = lerAgentes();
  registro.push({ id, nome: ficha.nome || 'Sem nome', classe: novoAgente.classe || classeValida, origem: origemValida, nex: 5, atualizadoEm: Date.now() });
  salvarAgentes(registro);
  window.location.href = 'ficha.html?id=' + encodeURIComponent(id);
}

renderAgentes();
</script>
