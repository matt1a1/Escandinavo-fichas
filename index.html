<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Escandinavo — Agentes</title>
<link rel="stylesheet" href="styles.css?v=fix7" />
<link rel="stylesheet" href="mobile.css?v=5" />
<style>
  :root{--ag-bg:#0f0f14;--ag-panel:#1a1a24;--ag-border:#2a2a3a;--ag-text:#e8e8f0;--ag-text-dim:#9797a8;--ag-accent:#8b5cf6;}
  body{margin:0;background:var(--ag-bg);color:var(--ag-text);font-family:system-ui,-apple-system,sans-serif;}
  .ag-search{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--ag-border);background:var(--ag-panel);color:var(--ag-text);margin-bottom:22px;font-size:.9rem;}
  .camp-ag-card{background:var(--ag-panel);border:1px solid var(--ag-border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;}
  .rm-ag{position:absolute;top:8px;right:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#9797a8;font-size:1.15rem;line-height:1;cursor:pointer;border-radius:6px;padding:0;z-index:2;}
  .rm-ag:hover{color:#f87171;background:rgba(248,113,113,.12);}
  .camp-ag-card .btn-acessar{margin-top:auto;align-self:flex-end;background:var(--ag-accent);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:600;cursor:pointer;text-decoration:none;}
</style>
<script>
// Loader mínimo: a index completa vem do CDN baseline; este arquivo só injeta o CSS do ×
fetch('https://cdn.jsdelivr.net/gh/matt1a1/Escandinavo-fichas@b147a55308aa192a3d4d2c4046c54f80a9e1afbd/index.html')
  .then(r => r.text())
  .then(html => {
    // injeta CSS do rm-ag se ainda não existir
    if (html.indexOf('.rm-ag{') === -1) {
      var css = '<style>.camp-ag-card{position:relative;}.rm-ag{position:absolute;top:8px;right:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#9797a8;font-size:1.15rem;line-height:1;cursor:pointer;border-radius:6px;padding:0;z-index:2;}.rm-ag:hover{color:#f87171;background:rgba(248,113,113,.12);}</style>';
      html = html.replace('</head>', css + '</head>');
    }
    document.open(); document.write(html); document.close();
  })
  .catch(function () {
    document.body.innerHTML = '<p style="padding:40px;color:#c00">Erro ao carregar. Tente Ctrl+F5.</p>';
  });
</script>
</head>
<body>
<p style="font-family:sans-serif;padding:40px;color:#888">Carregando…</p>
</body>
</html>
