<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Escandinavo Fichas — Ordem Paranormal</title>
  <script src="ficha-html.js?v=1"></script>
  <script>
    if (window.__FICHA_HTML__) {
      document.open();
      document.write(window.__FICHA_HTML__);
      document.close();
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px;color:#c00">Erro ao carregar a ficha. Arquivo ficha-html.js ausente ou incompleto.</p>';
      });
    }
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:40px;color:#888">Carregando ficha…</p>
</body>
</html>
